
{% extends "core/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <h2>🧩 {{ title }}</h2>
  <form method="post">
    {% csrf_token %}
    <table>{{ form.as_table }}</table>
    <button class="btn" type="submit">Enregistrer</button>
  </form>
</div>
{% endblock %}
