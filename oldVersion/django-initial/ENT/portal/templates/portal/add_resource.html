{% extends 'portal/base.html' %}

{% block title %}Ajouter une ressource – My ENT{% endblock %}

{% block content %}
<h2>Ajouter une ressource à « {{ course.title }} »</h2>
<div class="form-container">
  <form method="post">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <p style="text-align: right;">
      <button type="submit">Enregistrer</button>
    </p>
  </form>
</div>
{% endblock %}
