[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["src/*/migrations"]

[tool.ruff.lint]
# B : pièges classiques (arguments mutables par défaut, except trop large…).
# DJ : règles propres à Django (null=True sur du texte, __str__ manquant…).
select = ["E4", "E7", "E9", "F", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Les tests s'appuient sur des assertions et des fixtures verbeuses.
"src/*/tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "src/manage.py", "src/config/asgi.py", "src/config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Seuil volontairement bas : il sert de garde-fou contre une chute brutale, pas
# d'objectif à atteindre.
fail_under = 55
