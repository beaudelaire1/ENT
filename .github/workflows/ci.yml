name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myent_test
          POSTGRES_USER: myent
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myent -d myent_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgresql://myent:test-password@127.0.0.1:5432/myent_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run vendor
      - name: Vérifier la syntaxe des moteurs visuels
        run: |
          test -s src/static/vendor/three.module.js
          test -s src/static/vendor/three.core.js
          node --input-type=module -e "import('./src/static/vendor/three.module.js').then((THREE) => { if (!THREE.WebGLRenderer) process.exit(1); })"
          node --check src/static/sablier/decor.js
          node --check src/static/sablier/decor-core.js
          node --check src/static/sablier/seasonal-worlds.js
          node --input-type=module --check < src/static/sablier/premium3d.js
          node --input-type=module --check < src/static/sablier/premium3d/material-kit.js
          node --input-type=module --check < src/static/sablier/premium3d/flame-texture.js
          node --input-type=module --check < src/static/sablier/premium3d/ring.js
          node --input-type=module --check < src/static/sablier/premium3d/ring-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/hourglass.js
          node --input-type=module --check < src/static/sablier/premium3d/hourglass-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/wave.js
          node --input-type=module --check < src/static/sablier/premium3d/wave-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/candle.js
          node --input-type=module --check < src/static/sablier/premium3d/candle-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/beads.js
          node --input-type=module --check < src/static/sablier/premium3d/beads-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/bars.js
          node --input-type=module --check < src/static/sablier/premium3d/bars-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/spiral.js
          node --input-type=module --check < src/static/sablier/premium3d/spiral-realistic.js
          node --input-type=module --check < src/static/sablier/premium3d/celestial.js
          node --input-type=module --check < src/static/sablier/premium3d/celestial-realistic.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python src/manage.py check --deploy
      - run: python src/manage.py makemigrations --check --dry-run
      - run: python src/manage.py generate_chime
      - run: python src/manage.py collectstatic --noinput
      - run: ruff check src
      - run: ruff format --check src
      - run: >-
          coverage run src/manage.py test
          accounts.tests core.tests dashboard.tests formations.tests
          library.tests notifications.tests planner.tests sablier.tests
      - run: coverage report
