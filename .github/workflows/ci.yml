name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myent_test
          POSTGRES_USER: myent
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myent -d myent_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgresql://myent:test-password@127.0.0.1:5432/myent_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run vendor
      - name: Vérifier la syntaxe des moteurs visuels
        run: |
          test -s src/static/vendor/three.module.js
          test -s src/static/vendor/three.core.js
          test -s src/static/vendor/three-addons/objects/Sky.js
          node --check src/static/sablier/decor.js
          node --check src/static/sablier/decor-core.js
          node --check src/static/sablier/seasonal-worlds.js
          node --check src/static/sablier/sablier.js
          node --input-type=module --check < src/static/sablier/premium3d.js
          for module in src/static/sablier/premium3d/*.js; do
            node --input-type=module --check < "$module"
          done
      - name: Vérifier que le moteur 3D se résout entièrement hors ligne
        # Le repli 2D est silencieux : sans cette résolution complète du graphe
        # d'imports, un fichier vendu manquant ne se verrait qu'à l'écran.
        run: |
          node --input-type=module -e "await import('./src/static/vendor/three.module.js'); await import('./src/static/vendor/three-addons/postprocessing/EffectComposer.js'); await import('./src/static/vendor/three-addons/objects/Sky.js'); console.log('moteur 3D résolu');"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python src/manage.py check --deploy
      - run: python src/manage.py makemigrations --check --dry-run
      - run: python src/manage.py generate_chime
      - run: python src/manage.py collectstatic --noinput
      - run: ruff check src
      - run: ruff format --check src
      - run: >-
          coverage run src/manage.py test
          accounts.tests core.tests dashboard.tests formations.tests
          library.tests notifications.tests planner.tests sablier.tests
      - run: coverage report
